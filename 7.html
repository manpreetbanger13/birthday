<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Gift</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Georgia&display=swap" rel="stylesheet">
    <style>
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
        }
        
        .bg-video{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .gift-text {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: textFadeIn 1s ease-out;
        }

        @keyframes textFadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gift-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gift-box {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        .gift-lid {
            position: absolute;
            top: -20px;
            left: -10px;
            right: -10px;
            height: 40px;
            background: linear-gradient(135deg, #A52A2A 0%, #8B0000 100%);
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .gift-ribbon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .gift-ribbon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .gift-bow {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
        }

        .gift-bow::before,
        .gift-bow::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50% 50% 50% 0;
            top: 0;
        }

        .gift-bow::before {
            left: 0;
            transform: rotate(-45deg);
        }

        .gift-bow::after {
            right: 0;
            transform: rotate(45deg);
        }

        .gift-box.opened .gift-lid {
            transform: translateY(-50px) rotate(-20deg);
            opacity: 0;
        }

        .gift-picture {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 10px;
            object-fit: cover;
            opacity: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: all 0.5s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .gift-picture.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .love-text {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.5s ease;
            white-space: nowrap;
            z-index: 10;
        }

        .love-text.show {
            opacity: 1;
            bottom: -50px;
        }



        .open-button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            font-family: Georgia, serif;
        }

        .open-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .open-button:active {
            transform: scale(0.95);
        }

        .open-button.hidden {
            display: none;
        }
    </style>
</head>
<body>
     <video autoplay muted loop playsinline class="bg-video">
        <source src="image/mand/VID-20260703-WA0005.mp4" type="video/mp4">
    </video>
    
    <h1 class="gift-text">This is for your Birthday Gift</h1>
    
    <div class="gift-container">
        <div class="gift-box" id="giftBox">
            <div class="gift-lid">
                <div class="gift-bow"></div>
            </div>
            <div class="gift-ribbon"></div>
            <img src="image/mand/IMG_20260911_122110.jpg" alt="Birthday Gift" class="gift-picture" id="giftPicture">
            <div class="love-text ms-3" id="loveText">I Love You ❤️</div>
        </div>
    </div>
    
    <button class="open-button" id="openButton">Open Gift 🎁</button>

    <script>
        const giftBox = document.getElementById('giftBox');
        const giftPicture = document.getElementById('giftPicture');
        const loveText = document.getElementById('loveText');
        const openButton = document.getElementById('openButton');

        openButton.addEventListener('click', function() {
            giftBox.classList.add('opened');
            giftPicture.classList.add('show');
            loveText.classList.add('show');
            openButton.classList.add('hidden');
        });
    </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
